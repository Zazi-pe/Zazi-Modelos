# ZAZI — publica el catálogo en GitHub Pages.
# Antes de publicar revisa productos.json (validar.js). Si hay errores,
# no publica y la tienda sigue mostrando la última versión buena.
name: Publicar catálogo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Dos trabajos: "armar" revisa, arma el sitio y lo sube; "publicar" lo publica después.
# En un solo trabajo, deploy-pages a veces no encuentra lo recién subido
# ("No artifacts named github-pages", actions/deploy-pages#451).
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Revisar el catálogo
        run: node validar.js

      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp index.html admin.html productos.json validar.js shopify.js _site/
          if [ -d fotos ]; then cp -r fotos _site/; fi
          if [ -d img ]; then cp -r img _site/; fi

      # Vista previa al compartir el enlace (WhatsApp, Instagram): la imagen necesita la dirección completa,
      # que cambia en cada catálogo (zazi-pe.github.io/Zazi/ o /Zazi-Modelos/).
      - name: Dirección completa de la imagen para compartir
        run: |
          dueno="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://${dueno}.github.io/${repo}/img/compartir.jpg"
          sed -i "s|content=\"img/compartir.jpg\"|content=\"${url}\"|g" _site/index.html
          echo "Imagen para compartir: ${url} ($(grep -c "${url}" _site/index.html) etiquetas)"

      # Copias livianas de las fotos en _site/fotos-web/: WebP de 400 y 800 px de ancho y una del tamaño
      # original (-full, para pantallas 3x). La tienda las usa con <picture>; si alguna falta, muestra la original.
      # Calidad 82-85: a 75 se notaba en celulares (texturas pixeladas).
      - name: Fotos livianas (WebP)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp > /dev/null
          if [ -d _site/fotos ]; then
            find _site/fotos -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#_site/fotos/}"; base="${rel%.*}"
              mkdir -p "_site/fotos-web/$(dirname "$rel")"
              for ancho in 400 800; do
                cwebp -quiet -q 82 -m 6 -sharp_yuv -resize "$ancho" 0 "$f" -o "_site/fotos-web/${base}-${ancho}.webp" || echo "::warning::No se pudo crear la copia WebP de $rel"
              done
              cwebp -quiet -q 85 -m 6 -sharp_yuv "$f" -o "_site/fotos-web/${base}-full.webp" || echo "::warning::No se pudo crear la copia WebP de $rel"
            done
            echo "Fotos: $(du -sh _site/fotos | cut -f1) originales, $(du -sh _site/fotos-web | cut -f1) en WebP"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
